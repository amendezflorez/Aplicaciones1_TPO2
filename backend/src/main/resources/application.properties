spring.application.name=backend

# Puerto y context-path alineados con config/env.js del frontend
# (API_BASE_URL = http://10.0.2.2:3000/api, alias del emulador Android para localhost del host).
server.port=3000
server.servlet.context-path=/api

# H2 persistido en archivo (sobrevive a reinicios). Carpeta ./data ignorada por git.
spring.datasource.url=jdbc:h2:file:./data/hallado;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (desarrollo): http://localhost:3000/api/h2-console
# JDBC URL: jdbc:h2:file:./data/hallado  user: sa  password: (vacío)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT. Secreto generado para este proyecto (openssl rand -base64 48). Spring Boot mapea
# automáticamente la variable de entorno APP_JWT_SECRET a esta property (relaxed binding),
# así que para sobrescribirlo en otra máquina alcanza con setear esa env var; no se
# versiona acá un secreto de producción.
app.jwt.secret=3tYGxHgWDbkh+n1nAC+xx6rRzNv7lxYHLPnEIrFUvLclScMWU7nqJ5J+Byc0PRVe
# 7 días, igual al mock (services/mock/mockAdapter.js: TOKEN_TTL_SECONDS)
app.jwt.expiration-seconds=604800

# OTP: 6 dígitos, expira a los 10 min, cooldown de reenvío de 60s (igual a RESEND_SECONDS
# en config/constants.js del frontend), máximo 5 intentos de verificación por código.
app.otp.ttl-minutes=10
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5

# Carpeta local donde se guardan las fotos de perfil subidas (servidas en /uploads/**).
app.uploads.dir=uploads

logging.level.com.hallado.backend=INFO
